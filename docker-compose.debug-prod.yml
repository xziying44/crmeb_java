# 生产环境调试专用 - 反代到 https://admin.jqyiu.cn
# 使用方式: docker compose -f docker-compose.debug-prod.yml up
# 访问地址: http://localhost:9528
# 用完后: docker compose -f docker-compose.debug-prod.yml down

services:
  admin-debug:
    image: crmeb_java-admin
    container_name: crmeb-admin-debug-prod
    ports:
      - "9528:9527"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      - VUE_APP_API_PROXY=https://admin.jqyiu.cn
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules

volumes:
  admin_node_modules:
    external: true
    name: crmeb_java_admin_node_modules
