# CRMEB 相关配置
crmeb:
  version: CRMEB-JAVA-KY-v1.4 # 当前代码版本
  imagePath: /www/server/crmeb/upload/ # 服务器图片路径配置 斜杠结尾
  asyncConfig: true #是否同步config表数据到redis
  miniQrcodeEnvVersion: release # 小程序码环境版本：develop-开发版, trial-体验版, release-正式版

server:
  port: 20410

spring:
  profiles:
    #  配置的环境
    active: prod
    #  数据库配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:crmeb}?characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:crmeb}
    password: ${DB_PASSWORD} # 从环境变量注入，禁止提交明文口令
  redis:
    host: ${REDIS_HOST:127.0.0.1} #地址
    port: ${REDIS_PORT:6379} #端口
    password: ${REDIS_PASSWORD:} #从环境变量注入，默认空
    timeout: 10000 # 连接超时时间（毫秒）
    database: 0 #默认数据库
    jedis:
      pool:
        max-active: 200 # 连接池最大连接数（使用负值表示没有限制）
        max-wait: -1 # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-idle: 10 # 连接池中的最大空闲连接
        min-idle: 0 # 连接池中的最小空闲连接
        time-between-eviction-runs: -1 #逐出扫描的时间间隔(毫秒) 如果为负数,则不运行逐出线程, 默认-1

debug: false
logging:
  level:
    io.swagger.*: error
    com.zbjk.crmeb: info
    org.springframework.boot.autoconfigure: ERROR
  config: classpath:logback-spring.xml
  file:
    path: ./crmeb_log

# mybatis 配置
mybatis-plus:
  # 配置sql打印日志
  configuration:
    log-impl:

#swagger 配置
swagger:
  basic:
    enable: true #是否开启界面
    check: false #是否打开验证
    username: crmeb #访问swagger的账号
    password: crmeb.com #访问swagger的密码
